# Unified runtime + MCP config for the workflow skeleton.
# Environment variables can still override the values here.

[runtime]
model = "gpt-5"
timeout_s = 90
protocol_version = "2024-11-05"

[openai]
api_key = ""
base_url = "https://api.openai.com/v1"
api_mode = "responses"  # responses | chat_completions

[mcp]
artifacts_root = "./artifacts/runloop"

[code]
default_repo = ""

# Example repo layout for CODE_CHECK resolution:
# [repos.app]
# repo_url = "git@github.com:org/app.git"
# default_ref = "origin/main"
# repo_path = "/work/source/app"
# require_force_fetch = false
#
# [repos.kernel]
# repo_url = "git@github.com:org/kernel.git"
# default_ref = "origin/dev"
# repo_path = "/work/source/kernel"
# require_force_fetch = false

[mcp.servers.files]
command = "python3"
args = ["-m", "mcp_servers.file_tools_server_v2"]

[mcp.servers.files.env]
FILE_TOOLS_ROOT = "./artifacts/runloop"
FILE_TOOLS_MAX_FILE_BYTES = "8388608"

[mcp.servers.kb]
command = "python3"
args = ["-m", "mcp_servers.kb_server"]

[mcp.servers.code]
command = "python3"
args = ["-m", "mcp_servers.code_tools_server"]

[mcp.servers.jira]
command = "python3"
args = ["-m", "mcp_servers.jira_mcp_server_v2"]

[mcp.servers.jira.env]
JIRA_BASE_URL = ""
JIRA_API_PREFIX = ""
JIRA_AUTH = ""
JIRA_TOKEN = ""
JIRA_VERIFY_SSL = ""
