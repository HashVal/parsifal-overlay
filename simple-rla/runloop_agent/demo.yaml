workflow_id: jira_v2_phase_demo
start_phase: jira_phase
terminal_phases:
  - analysis_phase

phases:
  - id: jira_phase
    type: standard_phase
    next_phase: analysis_phase
    max_rollbacks: 0
    max_step_attempts: 1
    steps:
      - id: find_jira
        type: tool_step
        config:
          tool: find_jira_by_key
          args:
            jira_key: ${workflow.inputs.jira_key}
          outputs:
            artifact_key: jira_key_lookup
            nullable: true

      - id: grep_jira_properties
        type: tool_step
        config:
          tool: grep_jira_properties
          args:
            jira_key: ${workflow.inputs.jira_key}
          outputs:
            artifact_key: jira_properties

      - id: select_jira_attachments
        type: tool_step
        config:
          tool: select_jira_attachments
          args:
            jira_key: ${workflow.inputs.jira_key}
          outputs:
            artifact_key: jira_attachment_urls
            nullable: true

      - id: download_jira_attachments
        type: tool_step
        config:
          tool: download_jira_attachments
          args:
            jira_key: ${workflow.inputs.jira_key}
            attachment_urls: ${artifacts.jira_attachment_urls}
          outputs:
            artifact_key: artifact_attachments
            nullable: true

  - id: analysis_phase
    type: standard_phase
    max_rollbacks: 0
    max_step_attempts: 1
    steps:
      - id: extract_log_signatures
        type: tool_step
        config:
          tool: log_extract_signatures
          args:
            path: ${artifacts.artifact_attachments.0}
            profile: kernel
            max_total_signatures: 32
            max_chars: 12000
          outputs:
            artifact_key: signature_logs

      - id: summarize_jira_issue
        type: llm_step
        config:
          instruction: |
            Analyze the Jira case using the visible inputs.

            Goals:
            1. Extract a concise list of issue keywords.
            2. Write a short technical summary of the issue.
            3. Use the log signatures as the primary evidence source.
            4. If the Jira description and log signatures do not align, mention that explicitly.
            5. Do not invent evidence that is not present in the visible inputs.
          output_schema:
            type: object
            required:
              - issue_keywords
              - llm_sum_description
            properties:
              issue_keywords:
                type: array
                items:
                  type: string
              llm_sum_description:
                type: string
