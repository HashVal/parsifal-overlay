workflow_id: demo_tool_workflow
start_phase: collect_phase
terminal_phases:
  - collect_phase

phases:
  - id: collect_phase
    type: standard_phase
    max_rollbacks: 0
    max_step_attempts: 1
    steps:
      - id: seed_issue_key
        type: deterministic_step
        config:
          artifact_key: issue_key
          artifact_value: DEMO-123

      - id: fetch_jira_info
        type: tool_step
        config:
          tool: jira_get
          args:
            key: ${artifacts.issue_key}
          outputs:
            artifact_key: jira_info

      - id: list_jira_attachments
        type: tool_step
        config:
          tool: jira_list_attachments
          args:
            key: ${artifacts.issue_key}
          outputs:
            artifact_key: jira_attachments
            nullable: true
