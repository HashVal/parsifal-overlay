workflow_id: demo_llm_workflow
start_phase: phase1
terminal_phases:
  - phase1

phases:
  - id: phase1
    type: standard_phase
    max_rollbacks: 0
    max_step_attempts: 1
    steps:
      - id: seed_input
        type: deterministic_step
        config:
          artifact_key: jira_context
          artifact_value:
            title: demo issue
            summary: system fails to boot after firmware update
            platform: BMG

      - id: summarize_case
        type: llm_step
        config:
          model: gpt-5
          instruction: |
            Read the provided artifacts and return a JSON object with exactly these fields:
            - summary: a concise case summary string
            - confidence: one of high, medium, low
          output_schema:
            type: object
            required:
              - summary
              - confidence
