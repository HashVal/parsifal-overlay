workflow_id: jira_v2_phase_demo
start_phase: jira_phase
terminal_phases:
  - analysis_phase

phases:
  - id: jira_phase
    type: standard_phase
    next_phase: analysis_phase
    max_rollbacks: 0
    max_step_attempts: 1
    steps:
      - id: find_jira
        type: tool_step
        config:
          tool: find_jira_by_key
          args:
            jira_key: ${workflow.inputs.jira_key}
          outputs:
            artifact_key: jira_key_lookup
            nullable: true

      - id: grep_jira_properties
        type: tool_step
        config:
          tool: grep_jira_properties
          args:
            jira_key: ${workflow.inputs.jira_key}
          outputs:
            artifact_key: jira_properties

      - id: select_jira_attachments
        type: tool_step
        config:
          tool: select_jira_attachments
          args:
            jira_key: ${workflow.inputs.jira_key}
          outputs:
            artifact_key: jira_attachment_urls
            nullable: true

      - id: download_jira_attachments
        type: tool_step
        config:
          tool: download_jira_attachments
          args:
            jira_key: ${workflow.inputs.jira_key}
            attachment_urls: ${artifacts.jira_attachment_urls}
          outputs:
            artifact_key: artifact_attachments
            nullable: true

  - id: analysis_phase
    type: standard_phase
    max_rollbacks: 0
    max_step_attempts: 1
    steps:
      - id: extract_log_signatures
        type: tool_step
        config:
          tool: log_extract_evidence_batch
          args:
            paths: ${artifacts.artifact_attachments}
            profile: kernel
            max_events_per_file: 4
            max_error_events_per_file: 6
            max_chars_per_file: 12000
            max_files: 8
          outputs:
            artifact_key: signature_logs

      - id: extract_component_scope
        type: llm_step
        config:
          visible_artifacts:
            - jira_properties
            - signature_logs.merged
          instruction: |
            Extract component scope for the current case from the visible inputs.

            Your job is scope anchoring, not diagnosis, not KB retrieval, not root-cause analysis, and not case summary.

            Determine which component domains should be treated as primary analysis scope, which ones are secondary or peripheral, and how they map to fixed system roles.

            Fixed role meanings:
            - crash_path: the component or path closest to the observed crash or failure surface
            - ownership_path: the component or path responsible for driver binding, ownership, or active control of the affected device/function
            - config_path: the component or path where firmware, BIOS, ACPI, platform mode, or kernel policy activates or constrains the failing path
            - resource_path: the component or path most related to resource exposure, allocation, namespace, or enumeration constraints

            Requirements:
            1. Extract only component domains directly supported by the visible inputs.
            2. Select at most 3 primary components.
            3. Keep secondary components relevant but non-dominant.
            4. Use fixed role names exactly as defined above.
            5. Prefer component domains that explain the main crash path and the shared failing-mode scope.
            6. Do not let a component that explains only a side symptom dominate the primary scope.
            7. If a signal appears only in one failing mode but not all failing modes, it is more likely secondary unless evidence strongly shows otherwise.
            8. Use the platform context GPU topology (devices.gpu.topology) as a prior: if both igpu and dgpu are present, do not collapse the scope to a single GPU domain without direct evidence.
            9. scope_keywords should be short, reusable, and retrieval-friendly; avoid raw cmdline tokens or overly specific log fragments as primary keywords.
            10. Do not claim a root cause.

            Output limits:
            - primary_components: at most 3 items
            - secondary_components: at most 4 items
            - component_roles: at most 4 items
            - component_evidence: at most 5 items
            - scope_keywords: at most 6 items
          output_schema:
            type: object
            required:
              - primary_components
              - secondary_components
              - component_roles
              - component_evidence
              - scope_keywords
            properties:
              primary_components:
                type: array
                maxItems: 3
                items:
                  type: string
              secondary_components:
                type: array
                maxItems: 4
                items:
                  type: string
              component_roles:
                type: array
                maxItems: 4
                items:
                  type: object
                  required:
                    - component
                    - role
                  properties:
                    component:
                      type: string
                    role:
                      type: string
                      enum: [crash_path, ownership_path, config_path, resource_path]
              component_evidence:
                type: array
                maxItems: 5
                items:
                  type: string
              scope_keywords:
                type: array
                maxItems: 6
                items:
                  type: string

      - id: extract_observations
        type: llm_step
        config:
          visible_artifacts:
            - jira_key
            - jira_properties
            - signature_logs.merged
            - artifact:extract_component_scope
          instruction: |
            Extract a compact observation bundle from the visible inputs.

            Your job is evidence extraction, not diagnosis.

            Dependency rules:
            1. Treat upstream artifacts as input data, not as hypotheses to audit or re-derive.
            2. Do not re-run platform normalization, retrieval selection, or root-cause reasoning in this step.
            3. Do not question whether a previous step was correct; only extract what is explicitly supported by the visible inputs.

            Requirements:
            1. Extract only observations that are directly supported by the visible inputs.
            2. Prefer precise technical signals over broad narrative restatement.
            3. Keep each item short and literal.
            4. Do not infer root cause.
            5. If evidence is incomplete, keep the output sparse instead of filling gaps.

            Output limits:
            - key_observations: at most 5 items
            - contradictions: at most 2 items
            - missing_evidence: at most 3 items
            - observation_summary: one short paragraph, at most 3 sentences
          output_schema:
            type: object
            required:
              - key_observations
              - contradictions
              - missing_evidence
              - observation_summary
            properties:
              key_observations:
                type: array
                maxItems: 5
                items:
                  type: string
              contradictions:
                type: array
                maxItems: 2
                items:
                  type: string
              missing_evidence:
                type: array
                maxItems: 3
                items:
                  type: string
              observation_summary:
                type: string
                maxLength: 400

      - id: extract_platform_context
        type: llm_step
        config:
          visible_artifacts:
            - jira_properties
            - signature_logs.merged
            - platform_inventory
          instruction: |
            Extract normalized platform and GPU-topology context from the visible inputs.

            Your job is platform normalization and topology prior extraction, not root-cause analysis.

            You will receive:
            - case evidence from Jira and log-derived artifacts
            - a platform inventory with axes, canonical platform names, aliases, and optional platform config facts

            Dependency rules:
            1. This step is the only place in the analysis phase that should normalize platform names.
            2. Use the visible evidence and the platform inventory only.
            3. Do not predict what later steps may need.
            4. Do not add aliases, variants, or board strings unless they normalize to a canonical platform in the inventory.

            Requirements:
            1. Match only platforms that are directly supported by the visible inputs.
            2. Normalize matches to canonical names from the platform inventory.
            3. Keep host CPU platforms separate from GPU device platforms.
            4. If the inventory indicates the host platform has an integrated GPU, represent it under devices.gpu.igpu with integrated=true and source=host.
            5. If a discrete GPU platform is directly supported by the visible inputs, represent it under devices.gpu.dgpu.platforms.
            6. Explicitly set devices.gpu.topology to reflect whether the case indicates igpu only, dgpu only, or igpu+dgpu.
            7. Do not guess unsupported platforms or devices.
            8. Do not claim which GPU is responsible for the crash; this step only normalizes topology and platform facts.
            9. If unsure, leave lists empty and omit optional objects.

            Output limits:
            - host.cpu_platforms: at most 3 items
            - devices.gpu.dgpu.platforms: at most 3 items
            - platform_evidence: at most 5 short items
          output_schema:
            type: object
            required:
              - host
              - devices
              - platform_evidence
            properties:
              host:
                type: object
                required:
                  - cpu_platforms
                properties:
                  cpu_platforms:
                    type: array
                    maxItems: 3
                    items:
                      type: string
              devices:
                type: object
                required:
                  - gpu
                properties:
                  gpu:
                    type: object
                    required:
                      - topology
                    properties:
                      topology:
                        type: array
                        maxItems: 2
                        items:
                          type: string
                          enum: [igpu, dgpu]
                      igpu:
                        type: object
                        properties:
                          integrated:
                            type: boolean
                          source:
                            type: string
                            enum: [host]
                      dgpu:
                        type: object
                        properties:
                          platforms:
                            type: array
                            maxItems: 3
                            items:
                              type: string
              platform_evidence:
                type: array
                maxItems: 5
                items:
                  type: string

      - id: extract_retrieval_context
        type: llm_step
        config:
          visible_artifacts:
            - jira_properties
            - signature_logs.merged
            - artifact:extract_observations
            - artifact:extract_platform_context
            - artifact:extract_component_scope
          instruction: |
            Extract retrieval-oriented context for KB grounding from the visible inputs.

            Your job is retrieval-context extraction, not platform normalization, not case summary, and not root-cause analysis.

            Dependency rules:
            1. Treat upstream artifacts as authoritative inputs for this step.
            2. Do not re-check, re-score, or second-guess whether a previous step was correct.
            3. If normalized platform results are present, use them as the only source for the `platforms` field.
            4. Do not introduce additional platform names, aliases, board variants, DMI strings, or inferred platform labels beyond the normalized platform artifact.
            5. Use this step only to flatten existing results into retrieval-friendly fields.

            Requirements:
            1. Extract only items that are directly supported by the visible inputs.
            2. Prefer concrete technical entities over broad narrative phrases.
            3. Keep the output sparse. Do not add generic filler.
            4. Do not infer root cause.
            5. The `signals` field is for KB-friendly query keywords and short technical phrases, not raw log tokens.
            6. Prefer broad but discriminative retrieval terms such as driver names, subsystem names, component names, mode names, and short fault phrases.
            7. Use the component scope artifact to bias retrieval: prefer signals/subsystems derived from primary_components and scope_keywords; keep secondary_components as supporting context unless they explain the shared failing-mode pattern.
            8. Avoid overly specific strings such as exact cmdline tokens, exact file paths, exact line numbers, or long raw log excerpts unless they are clearly standard KB keywords.
            9. Reuse normalized platform results when present.

            Signal selection guidance:
            - Good examples: `xe`, `i915`, `drm`, `gpu`, `kernel BUG`, `hybrid mode`, `integrated mode`, `driver blacklist`
            - Avoid as primary signals: `drivers/gpu/drm/drm_gem.c:181`, `xe.force_probe=*`, `modprobe.blacklist=i915`

            Output limits:
            - platforms: at most 4 items
            - subsystems: at most 4 items
            - signals: at most 6 items
          output_schema:
            type: object
            required:
              - platforms
              - subsystems
              - signals
            properties:
              platforms:
                type: array
                maxItems: 4
                items:
                  type: string
              subsystems:
                type: array
                maxItems: 4
                items:
                  type: string
              signals:
                type: array
                maxItems: 6
                items:
                  type: string

      - id: summarize_jira_issue
        type: llm_step
        config:
          visible_artifacts:
            - artifact:extract_observations
            - artifact:extract_component_scope
          instruction: |
            Summarize the Jira case based on the extracted observations.

            Dependency rules:
            1. Treat extracted observations as the primary source for this step.
            2. Do not re-extract evidence from raw Jira/log artifacts when the observation artifact already provides it.
            3. Do not re-evaluate whether previous steps were correct.
            4. Do not regenerate platform normalization or retrieval context in this step.

            Requirements:
            1. Use the extracted observations as the primary basis.
            2. Use the component scope artifact to keep the summary centered on the primary components and their roles; treat secondary components as supporting context.
            3. Produce a concise list of issue keywords.
            4. Write a short technical summary of the case.
            5. If the evidence is incomplete or contradictory, reflect that clearly.
            6. Do not introduce unsupported root-cause claims.

            Important:
            - Do not mention schema fields such as type, properties, required, items, object, or array.
            - Do not discuss the JSON format.
            - Do not output planning text, self-check text, or internal reasoning.
            - Do not wrap the answer in markdown code fences.
            - Do not repeat the answer or emit multiple JSON objects.
            - Return only the final JSON object with the required keys.

            Output limits:
            - issue_keywords: at most 5 items
            - llm_sum_description: at most 3 short sentences
          output_schema:
            type: object
            required:
              - issue_keywords
              - llm_sum_description
            properties:
              issue_keywords:
                type: array
                maxItems: 5
                items:
                  type: string
              llm_sum_description:
                type: string
                maxLength: 400

      - id: extract_failure_mode_frame
        type: llm_step
        config:
          visible_artifacts:
            - artifact:extract_component_scope
            - artifact:extract_platform_context
            - artifact:extract_observations
            - artifact:summarize_jira_issue
          instruction: |
            Identify the most likely failure mode(s) for this case and define a verification frame.

            Your job is failure-mode framing, not root-cause selection.

            Dependency rules:
            1. Use only the visible inputs.
            2. Do not re-derive platform normalization or component scope.
            3. Do not propose a concrete root cause; that is handled downstream.
            4. Prefer modes that explain all failing modes and the working-mode contrast.

            Failure mode taxonomy (enum):
            - policy_vs_activation_mismatch
            - ownership_binding_mismatch
            - missing_prerequisite_or_config
            - invalid_or_corrupted_state
            - resource_exhaustion_or_allocation_failure
            - initialization_order_or_race
            - unsupported_combination_or_compat_gap
            - unknown

            Requirements:
            1. Output exactly 1 primary failure mode and up to 2 secondary failure modes.
            2. For each failure mode, provide:
               - why_it_fits: evidence-based bullets
               - why_not_certain: concrete gaps/uncertainties
               - must_check: discriminating checks (runnable/observable)
            3. Every bullet/check must include at least one hard evidence anchor token copied from inputs (e.g., `xe.force_probe=*`, `AE_ALREADY_EXISTS`, `drm_gem_private_object_init`, `xe_bo_init_locked`, `devices.gpu.topology`). Avoid generic prose without anchors.
            4. If devices.gpu.topology includes both igpu and dgpu, do not collapse framing to a single GPU path unless evidence explicitly identifies the failing GPU path.
            5. Keep checks generic and workflow-friendly: avoid deep code changes; prefer A/B configuration and evidence capture.

            Anti-loop / anti-prose rules:
            - Do not output paragraphs of analysis.
            - Do not repeat any sentence.
            - Do not use filler phrases like "nuanced", "complex interaction", "deeper systemic issue", or "diagnostic landscape".
            - Return only the final JSON object.

            Output limits:
            - why_it_fits: at most 3 bullets per mode
            - why_not_certain: at most 3 bullets per mode
            - must_check: at most 4 items per mode
          output_schema:
            type: object
            required:
              - primary_failure_mode
              - secondary_failure_modes
            properties:
              primary_failure_mode:
                type: object
                required:
                  - mode
                  - why_it_fits
                  - why_not_certain
                  - must_check
                properties:
                  mode:
                    type: string
                    enum:
                      - policy_vs_activation_mismatch
                      - ownership_binding_mismatch
                      - missing_prerequisite_or_config
                      - invalid_or_corrupted_state
                      - resource_exhaustion_or_allocation_failure
                      - initialization_order_or_race
                      - unsupported_combination_or_compat_gap
                      - unknown
                  why_it_fits:
                    type: array
                    maxItems: 3
                    items:
                      type: string
                      maxLength: 200
                  why_not_certain:
                    type: array
                    maxItems: 3
                    items:
                      type: string
                      maxLength: 200
                  must_check:
                    type: array
                    maxItems: 4
                    items:
                      type: string
                      maxLength: 200
              secondary_failure_modes:
                type: array
                maxItems: 2
                items:
                  type: object
                  required:
                    - mode
                    - why_it_fits
                    - why_not_certain
                    - must_check
                  properties:
                    mode:
                      type: string
                      enum:
                        - policy_vs_activation_mismatch
                        - ownership_binding_mismatch
                        - missing_prerequisite_or_config
                        - invalid_or_corrupted_state
                        - resource_exhaustion_or_allocation_failure
                        - initialization_order_or_race
                        - unsupported_combination_or_compat_gap
                        - unknown
                    why_it_fits:
                      type: array
                      maxItems: 3
                      items:
                        type: string
                        maxLength: 200
                    why_not_certain:
                      type: array
                      maxItems: 3
                      items:
                        type: string
                        maxLength: 200
                    must_check:
                      type: array
                      maxItems: 4
                      items:
                        type: string
                        maxLength: 200

      - id: extract_cross_layer_conflicts
        type: llm_step
        config:
          visible_artifacts:
            - jira_properties
            - signature_logs.merged
            - artifact:extract_observations
            - artifact:extract_platform_context
            - artifact:summarize_jira_issue
            - artifact:extract_component_scope
            - artifact:extract_failure_mode_frame
          instruction: |
            Extract explicit cross-layer contradictions and policy mismatches from the visible inputs.

            Your job is not root-cause analysis, not KB retrieval, and not case summary.

            Focus on relationships across system layers, such as:
            - firmware / BIOS / ACPI mode selection
            - platform or device activation paths
            - kernel cmdline or module policy
            - driver ownership / binding policy
            - resource exposure, namespace exposure, or allocation constraints
            - working-mode vs failing-mode differences

            Requirements:
            1. Extract only facts directly supported by the visible inputs.
            2. Account for structured GPU topology from platform context first. If devices.gpu.topology includes both igpu and dgpu, do not assume a single-GPU failing path without direct evidence.
            3. Use the component scope artifact to bias contradictions toward relationships across crash_path, ownership_path, and config_path; treat resource_path-only issues as secondary unless they explain the shared failing-mode pattern.
            4. Separate activation facts, policy facts, and resource/namespace facts.
            5. Prioritize explicit contradictions where an active or required path is blocked, redirected, blacklisted, or mismatched by policy.
            5. Prefer ownership mismatch, policy-vs-activation mismatch, and working-vs-failing mode isolation over generic firmware_vs_driver wording.
            6. State each contradiction in plain technical language, not abstract labels.
            7. Do not claim a root cause.
            8. Do not restate generic observations without a cross-layer contradiction.
            9. If evidence is incomplete, put the gap into missing_checks instead of over-claiming.

            Contradiction patterns to consider:
            - an enabled or active device/path vs a blacklisted or disabled driver path
            - a forced driver policy vs the device ownership path implied by the failing modes
            - a working/failing mode difference that isolates a conflicting driver or configuration path
            - a required resource path vs a policy or allocation state that makes that path invalid
            - a firmware-exposed path that conflicts with the software ownership or initialization policy

            Output limits:
            - activation_facts: at most 4 items
            - policy_facts: at most 4 items
            - resource_or_namespace_facts: at most 4 items
            - conflicts: at most 3 items
            - missing_checks: at most 4 items
          output_schema:
            type: object
            required:
              - activation_facts
              - policy_facts
              - resource_or_namespace_facts
              - conflicts
              - missing_checks
            properties:
              activation_facts:
                type: array
                maxItems: 4
                items:
                  type: string
              policy_facts:
                type: array
                maxItems: 4
                items:
                  type: string
              resource_or_namespace_facts:
                type: array
                maxItems: 4
                items:
                  type: string
              conflicts:
                type: array
                maxItems: 3
                items:
                  type: object
                  required:
                    - conflict_type
                    - statement
                    - why_it_matters
                    - confidence
                  properties:
                    conflict_type:
                      type: string
                      enum: [ownership_mismatch, policy_vs_activation, resource_vs_policy, firmware_vs_driver]
                    statement:
                      type: string
                      maxLength: 200
                    why_it_matters:
                      type: array
                      maxItems: 4
                      items:
                        type: string
                    confidence:
                      type: string
                      enum: [high, medium, low]
              missing_checks:
                type: array
                maxItems: 4
                items:
                  type: string

      - id: kb_ground_case
        type: tool_step
        config:
          tool: kb_ground
          args:
            context:
              case_id: ${workflow.inputs.jira_key}
              platforms: ${artifacts.artifact:extract_retrieval_context.platforms}
              subsystems: ${artifacts.artifact:extract_retrieval_context.subsystems}
            signals:
              $repeat: ${artifacts.artifact:extract_retrieval_context.signals}
              template:
                type: symptom
                value: ${item}
            hints:
              preferred_kinds:
                - issue_pattern
                - rca
                - code_note
                - platform_note
              exclude_ids:
                - code-note-drm-gem-private-object-init-example
                - issue-pattern-bmg-xe-gem-private-object-init-example
                - platform-note-bmg-hybrid-integrated-modes-example
                - playbook-kernel-panic-triage-example
                - rca-pkt-20231-example
                - workaround-bmg-xe-mode-restriction-example
            limits:
              max_total_hits: 4
              max_hits_per_kind: 1
              include_snippets: true
          outputs:
            artifact_key: kb_grounding
            nullable: true

      - id: propose_root_cause
        type: llm_step
        config:
          visible_artifacts:
            - jira_properties
            - artifact:extract_component_scope
            - artifact:extract_observations
            - artifact:extract_platform_context
            - artifact:extract_retrieval_context
            - artifact:summarize_jira_issue
            - artifact:extract_failure_mode_frame
            - artifact:extract_cross_layer_conflicts
            - kb_grounding
          instruction: |
            Propose constrained root-cause hypotheses for the current case.

            Use the platform context topology, the component scope artifact, the failure-mode frame, extracted observations, the case summary, the cross-layer conflict artifact, and the KB grounding as the primary basis.
            Treat platform context GPU topology (devices.gpu.topology) as a required prior. Do not collapse an igpu+dgpu topology into a single-GPU explanation unless visible evidence explicitly identifies the failing GPU path.
            Treat the component scope artifact as the authoritative scope anchor (primary vs secondary domains, and role mapping).
            Treat the failure-mode frame as a constraint on narrative shape: describe (a) triggering conditions consistent with the primary failure mode and (b) the triggering code path when available.
            Treat the cross-layer conflict artifact as the authoritative summary of explicit system-level contradictions and policy mismatches.
            Prefer hypotheses centered on primary components and their roles (crash_path/ownership_path/config_path), using secondary components as supporting or alternative factors unless they better explain all failing modes.
            Do not present the answer as final truth.
            Produce hypotheses only when supported by visible evidence.
            If the evidence is weak or conflicting, say so explicitly.

            Output limits:
            1. candidate_root_causes: at most 3 items.
            2. Each candidate title should be short.
            3. why_it_matches and why_not_certain should each contain short bullet-like strings.
            4. recommended_next_checks: at most 4 items.
            5. Keep evidence_summary concise.
          output_schema:
            type: object
            required:
              - candidate_root_causes
              - primary_hypothesis
              - evidence_summary
              - recommended_next_checks
              - confidence_overall
            properties:
              candidate_root_causes:
                type: array
                items:
                  type: object
                  required:
                    - title
                    - confidence
                    - why_it_matches
                    - why_not_certain
                  properties:
                    title:
                      type: string
                    confidence:
                      type: string
                    why_it_matches:
                      type: array
                      items:
                        type: string
                    why_not_certain:
                      type: array
                      items:
                        type: string
              primary_hypothesis:
                type: string
              evidence_summary:
                type: string
              recommended_next_checks:
                type: array
                items:
                  type: string
              confidence_overall:
                type: string

      - id: extract_evidence_chains
        type: llm_step
        config:
          visible_artifacts:
            - jira_properties
            - signature_logs.merged
            - artifact:extract_component_scope
            - artifact:extract_observations
            - artifact:extract_platform_context
            - artifact:extract_cross_layer_conflicts
            - artifact:summarize_jira_issue
            - artifact:propose_root_cause
          instruction: |
            Derive testable evidence chains from the proposed root-cause artifact.

            Your job is not to invent a new root cause. Treat the proposed primary hypothesis as a candidate explanation to test, not as established truth.

      - id: summary_analysis_data
        type: llm_step
        config:
          visible_artifacts:
            - artifact:extract_evidence_chains
            - artifact:propose_root_cause
            - artifact:extract_platform_context
            - artifact:extract_component_scope
            - artifact:extract_failure_mode_frame
          instruction: |
            Summarize the analysis phase artifacts needed to generate future DEBUG_STEPS.

            Your job is phase-internal consolidation and DRY overlap annotation.
            Do not generate any debug steps. Do not propose any new hypotheses.

            You will receive the following artifacts (A-E):
            A) artifact:extract_evidence_chains
            B) artifact:propose_root_cause
            C) artifact:extract_platform_context
            D) artifact:extract_component_scope
            E) artifact:extract_failure_mode_frame

            Requirements:
            1. List exactly these five artifacts as the required set for generating DEBUG_STEPS.
            2. For each artifact, include its producer step and the minimal subset of fields that should be used downstream.
            3. Identify overlaps between artifacts (DRY). Prefer naming specific fields that overlap.
            4. Provide short deduplication guidance that states which artifact should be treated as authoritative for which kind of information.
            5. Keep the output compact and strictly structured.

            Important:
            - Do not mention schema fields such as type, properties, required, items, object, or array.
            - Do not discuss the JSON format.
            - Do not output planning text, self-check text, or internal reasoning.
            - Do not wrap the answer in markdown code fences.
            - Do not repeat the answer or emit multiple JSON objects.
            - Return only the final JSON object with the required keys.

            Output limits:
            - artifacts_needed_for_debug_steps: exactly 5 items
            - overlaps: at most 10 items
            - dedup_guidance: at most 7 items
          output_schema:
            type: object
            required:
              - artifacts_needed_for_debug_steps
              - overlaps
