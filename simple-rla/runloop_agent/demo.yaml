workflow_id: demo_llm_tool_workflow
start_phase: phase1
terminal_phases:
  - tool_phase

phases:
  - id: phase1
    type: standard_phase
    next_phase: tool_phase
    max_rollbacks: 0
    max_step_attempts: 1
    steps:
      - id: seed_input
        type: deterministic_step
        config:
          artifact_key: jira_context
          artifact_value:
            title: demo issue
            summary: system fails to boot after firmware update
            platform: BMG

      - id: summarize_case
        type: llm_step
        config:
          instruction: |
            Read the provided artifacts and return a JSON object with exactly these fields:
            - summary: a concise case summary string
            - confidence: one of high, medium, low
          output_schema:
            type: object
            required:
              - summary
              - confidence

  - id: tool_phase
    type: standard_phase
    max_rollbacks: 0
    max_step_attempts: 1
    steps:
      - id: inspect_workspace
        type: llm_tool_step
        config:
          instruction: |
            Use the available file tools to inspect the workspace artifacts and then return a JSON object with exactly these fields:
            - observation: a concise description of what you inspected
            - confidence: one of high, medium, low
          allowed_tool_families:
            - files
          output_schema:
            type: object
            required:
              - observation
              - confidence
          max_model_turns: 4
          max_tool_calls: 4
