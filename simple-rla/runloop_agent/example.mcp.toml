[client]
name = "kernel-rca-runloop"
version = "0.1"
protocol_version = "2024-11-05"

# Where the runloop itself stores request/response logs.
# (This is separate from Parsifal's own artifacts root.)
artifacts_root = "../../artifacts/runloop"

[mcp_servers.jira]
command = "python3"
args = ["-m", "mcp_servers.jira_server"]

[mcp_servers.jira.env]
JIRA_BASE_URL = "https://jira.devtools.mycompany.com"
JIRA_API_PREFIX = "/rest/api/2"
JIRA_AUTH = "basic"
JIRA_USER = "YOUR_USER"
JIRA_TOKEN = "YOUR_TOKEN"
JIRA_VERIFY_SSL = "true"

# Optional: Parsifal overlay tools (requires `pip install mcp` in that python env)
# [mcp_servers.parsifal]
# command = "python3"
# args = ["../mcp_server.py"]
#
# [mcp_servers.parsifal.env]
# PARSIFAL_SPEC_ROOT = "../../kernel-rca-bot"
# PARSIFAL_ARTIFACTS_ROOT = "../../artifacts"
# PARSIFAL_TEMPLATES_ROOT = "../templates"
