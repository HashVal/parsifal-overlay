[client]
name = "kernel-rca-runloop"
version = "0.1"
protocol_version = "2024-11-05"

# Where the runloop itself stores request/response logs.
# (This is separate from Parsifal's own artifacts root.)
artifacts_root = "../../artifacts/runloop"

[mcp_servers.jira]
command = "python3"
args = ["-m", "mcp_servers.jira_server"]

[mcp_servers.jira.env]
JIRA_BASE_URL = "https://jira.devtools.intel.com"
JIRA_API_PREFIX = "/rest/api/latest"
JIRA_AUTH = "bearer"
JIRA_TOKEN = "YOUR_BEARER_TOKEN"
JIRA_VERIFY_SSL = "true"

[mcp_servers.files]
command = "python3"
args = ["-m", "mcp_servers.file_tools_server"]

[mcp_servers.files.env]
# The runloop also exports SIMPLE_RLA_WORKSPACE_DIR per run; this fallback keeps
# the file server usable in ad-hoc/manual testing too.
FILE_TOOLS_ROOT = "../../artifacts/runloop"
FILE_TOOLS_MAX_FILE_BYTES = "8388608"

[mcp_servers.kb]
command = "python3"
args = ["-m", "mcp_servers.kb_server"]

# Alternative: basic auth (known-working in some environments)
# JIRA_AUTH = "basic"
# JIRA_USER = "YOUR_USER"
# JIRA_PASSWORD = "YOUR_PASSWORD"
# Note: current jira_server.py still falls back to JIRA_TOKEN in basic mode;
# prefer JIRA_PASSWORD in docs/config going forward for clarity.

# Optional: Parsifal overlay tools (requires `pip install mcp` in that python env)
# [mcp_servers.parsifal]
# command = "python3"
# args = ["../mcp_server.py"]
#
# [mcp_servers.parsifal.env]
# PARSIFAL_SPEC_ROOT = "../../kernel-rca-bot"
# PARSIFAL_ARTIFACTS_ROOT = "../../artifacts"
# PARSIFAL_TEMPLATES_ROOT = "../templates"
