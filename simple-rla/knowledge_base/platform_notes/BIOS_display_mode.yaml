id: platform-note-bios-display-mode
kind: platform_note
status: confirmed
title: BIOS display mode semantics
summary: >
  Describes the BIOS knob `display mode` and defines the semantics of its three
  options: integrated mode, discrete mode, and hybrid mode.
content: |
  This note records the known semantics of the BIOS setting `display mode`.

  `display mode` is a BIOS knob that controls which GPU devices are enabled
  during BIOS initialization.

  The three currently known options are:
  - integrated mode
  - discrete mode
  - hybrid mode

  These options should be treated as platform configuration modes that influence
  which GPU devices are enabled at BIOS initialization time. They are therefore
  important case-context signals during graphics bring-up, debugging, and RCA.

  When comparing cases across display modes, the mode should first be understood
  as a BIOS configuration choice rather than as a root cause by itself. At the
  same time, mode comparison is useful because failures reproduced across
  multiple display modes may indicate a shared lower-level path, while failures
  isolated to one mode may indicate a mode-specific enablement or routing issue.

