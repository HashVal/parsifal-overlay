facts:
  - BIOS provides a setting named `display mode`.
  - `display mode` is a BIOS knob.
  - `display mode` controls which GPU devices are enabled during BIOS initialization.
  - `integrated mode` means BIOS enables only the integrated GPU during initialization.
  - `discrete mode` means BIOS enables only the discrete GPU during initialization.
  - `hybrid mode` means BIOS enables both the integrated GPU and the discrete GPU during initialization.

terminology:
  display_mode: >
    A BIOS configuration knob that determines which GPU devices are enabled
    during BIOS initialization.
  integrated: >
    BIOS display mode in which only the integrated GPU is enabled during BIOS
    initialization.
  discrete: >
    BIOS display mode in which only the discrete GPU is enabled during BIOS
    initialization.
  hybrid: >
    BIOS display mode in which both the integrated GPU and the discrete GPU are
    enabled during BIOS initialization.

constraints:
  - Do not treat the BIOS display mode label itself as the root cause.
  - Treat display mode as an important case-context field when comparing failures.
  - If the same failure reproduces across multiple display modes, prioritize investigation of shared lower-level code paths.
  - If a failure appears only in one display mode, keep mode-specific enablement and routing behavior in scope.

analysis_notes:
  - Record the BIOS display mode explicitly in Jira cases, RCA notes, and KB-backed grounding inputs.
  - Use display mode comparison to separate shared-path failures from mode-specific configuration issues.
  - Display mode is especially relevant when evaluating GPU enumeration, initialization path, and graphics stack bring-up differences.

