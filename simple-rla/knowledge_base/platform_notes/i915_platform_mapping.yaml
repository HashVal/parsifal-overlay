facts:
  - i915 is Intel's older-generation Linux DRM graphics driver.
  - In the current working platform model, i915 supports TGL, ADL, RPL, MTL, and ARC.
  - RPL is treated as an x86 CPU platform with integrated graphics.
  - TGL, ADL, RPL, and MTL are treated as platforms whose graphics support falls into the i915-driver context.
  - ARC is included in the current working i915 support model.

terminology:
  i915: >
    Intel's older-generation Linux DRM graphics driver in the current working
    platform model.
  TGL: >
    A platform generation mapped to the i915-driver context in the current
    working model.
  ADL: >
    A platform generation mapped to the i915-driver context in the current
    working model.
  RPL: >
    An Intel x86 CPU platform with integrated graphics, mapped to the i915-driver
    context in the current working model.
  MTL: >
    A platform generation mapped to the i915-driver context in the current
    working model.
  ARC: >
    A platform family included in the current working i915 support model.

constraints:
  - Do not default i915-mapped platform analysis into the xe driver context unless platform evidence explicitly indicates a newer xe-mapped path.
  - Keep platform identity and driver identity distinct, but preserve their mapping explicitly in KB objects.
  - Treat the driver mapping as a grounding aid for Linux graphics analysis.

analysis_notes:
  - When a case carries platform signals such as TGL, ADL, RPL, MTL, or ARC, prefer i915-oriented platform and code knowledge.
  - Use this mapping to guide which driver context should dominate initial triage and KB grounding.
  - This note is about driver/platform mapping, not a final statement about root cause.

