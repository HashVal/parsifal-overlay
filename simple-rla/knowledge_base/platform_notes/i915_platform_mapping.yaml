id: platform-note-i915-platform-mapping
kind: platform_note
status: confirmed
title: i915 platform mapping
summary: >
  Describes i915 as Intel's older-generation Linux DRM graphics driver and
  records the current working platform mapping for i915-supported platforms.
content: |
  The i915 driver is Intel's older-generation Linux DRM graphics driver.

  In the current working platform model, i915 supports earlier Intel graphics
  platforms and remains the primary Linux graphics driver context for a wide
  range of integrated and earlier graphics deployments.

  The current working mapping includes:
  - TGL
  - ADL
  - RPL
  - MTL
  - ARC

  In this mapping:
  - RPL is treated as an x86 CPU platform with integrated graphics
  - TGL, ADL, RPL, and MTL are treated as platforms whose graphics support falls
    into the i915-driver context
  - ARC is also included in the current working i915 support model

  This note is intended to guide case grounding and triage. When a case is
  associated with one of the i915-mapped platforms, Linux graphics analysis
  should primarily be framed in the i915-driver context rather than the xe-driver
  context unless explicit evidence suggests otherwise.

