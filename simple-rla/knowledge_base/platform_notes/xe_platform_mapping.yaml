facts:
  - xe is Intel's newer-generation Linux DRM graphics driver.
  - In the current working platform model, xe supports both newer dGPU and iGPU platforms.
  - The current working xe platform mapping includes BMG, ARL, LNL, and PTL.
  - BMG is treated as a dGPU platform in this mapping.
  - ARL, LNL, and PTL are treated as platforms whose graphics support falls into the xe-driver context.

terminology:
  xe: >
    Intel's newer-generation Linux DRM graphics driver for newer graphics
    platforms in the current working model.
  BMG: >
    BattleMage, treated as a discrete GPU platform in the xe-driver mapping.
  ARL: >
    A platform generation mapped to the xe-driver context in the current working
    model.
  LNL: >
    A platform generation mapped to the xe-driver context in the current working
    model.
  PTL: >
    A platform generation mapped to the xe-driver context in the current working
    model.

constraints:
  - Do not default xe-mapped platform analysis into the i915 driver context.
  - Keep platform identity and driver identity distinct, but preserve their mapping explicitly in KB objects.
  - Treat the driver mapping as a grounding aid for Linux graphics analysis.

analysis_notes:
  - When a case carries platform signals such as BMG, ARL, LNL, or PTL, prefer xe-oriented platform and code knowledge.
  - Use this mapping to guide which driver context should dominate initial triage and KB grounding.
  - This note is about driver/platform mapping, not a final statement about root cause.

