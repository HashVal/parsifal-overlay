id: platform-note-xe-platform-mapping
kind: platform_note
status: confirmed
title: xe platform mapping
summary: >
  Describes xe as Intel's newer-generation Linux DRM graphics driver and records
  the current working platform mapping for xe-supported platforms.
content: |
  The xe driver is Intel's newer-generation Linux DRM graphics driver for newer
  graphics platforms.

  In the current working platform model, xe supports both newer discrete GPU
  (dGPU) and integrated GPU (iGPU) platforms.

  The current working mapping includes:
  - BMG
  - ARL
  - LNL
  - PTL

  In this mapping:
  - BMG is treated as a discrete GPU platform
  - ARL, LNL, and PTL are treated as newer CPU/platform generations whose
    graphics support falls into the xe-driver context

  This note is intended to guide case grounding and triage. When a case is
  associated with one of the xe-mapped platforms, Linux graphics analysis should
  primarily be framed in the xe-driver context rather than the i915-driver
  context.

